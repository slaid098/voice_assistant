name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        shell: powershell
        run: pip install uv
      - name: Sync deps
        shell: powershell
        run: uv sync --extra dev

      - name: Download Vosk STT model
        shell: powershell
        run: |
          $dir = "dist/models/vosk_stt"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip"
          Invoke-WebRequest -Uri $url -OutFile "$dir/vosk-model-small-ru-0.22.zip"
          Expand-Archive -Path "$dir/vosk-model-small-ru-0.22.zip" -DestinationPath $dir -Force
          Remove-Item "$dir/vosk-model-small-ru-0.22.zip"

      - name: Download Vosk TTS model
        shell: powershell
        run: |
          $dir = "dist/models/vosk_tts"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://alphacephei.com/vosk/models/vosk-model-tts-ru-0.7-multi.zip"
          Invoke-WebRequest -Uri $url -OutFile "$dir/vosk-model-tts-ru-0.7-multi.zip"
          Expand-Archive -Path "$dir/vosk-model-tts-ru-0.7-multi.zip" -DestinationPath $dir -Force
          Remove-Item "$dir/vosk-model-tts-ru-0.7-multi.zip"

      - name: Copy openWakeWord model
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist/models/openwakeword
          Copy-Item models/openwakeword/wiki.onnx dist/models/openwakeword/

      - name: Build with PyInstaller
        shell: powershell
        run: |
          uv run pyinstaller --noconfirm --onefile `
            --name voice-assistant `
            --collect-data voice_assistant `
            --collect-all vosk `
            --collect-all vosk_tts `
            --collect-all openwakeword `
            --collect-all onnxruntime `
            src/voice_assistant/__main__.py

      - name: Package release
        shell: powershell
        run: |
          Copy-Item .env.template dist/.env
          Copy-Item README.md dist/
          Copy-Item CHANGELOG.md dist/
          Copy-Item scripts/install_autorun.bat dist/
          Copy-Item scripts/remove_autorun.bat dist/
          Compress-Archive -Path dist/voice-assistant.exe,dist/models,dist/.env,dist/README.md,dist/CHANGELOG.md,dist/install_autorun.bat,dist/remove_autorun.bat `
            -DestinationPath dist/voice-assistant.zip

      - name: Create Forgejo release
        shell: powershell
        run: |
          $headers = @{ "Authorization" = "token $env:GITHUB_TOKEN" }
          $body = @{ tag_name = "$env:GITHUB_REF_NAME"; name = "$env:GITHUB_REF_NAME"; body = Get-Content CHANGELOG.md -Raw } | ConvertTo-Json
          $resp = Invoke-RestMethod -Uri "$env:GITHUB_SERVER_URL/api/v1/repos/slaid098/voice_assistant/releases" -Method Post -Headers $headers -Body $body -ContentType "application/json"
          $uploadUrl = "$env:GITHUB_SERVER_URL/api/v1/repos/slaid098/voice_assistant/releases/$($resp.id)/assets"
          Invoke-RestMethod -Uri "$uploadUrl?name=voice-assistant.zip" -Method Post -Headers $headers -InFile dist/voice-assistant.zip -ContentType "application/zip"
