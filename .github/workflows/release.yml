name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        shell: powershell
        run: pip install uv
      - name: Sync deps
        shell: powershell
        run: uv sync --extra dev

      - name: Download Vosk STT model
        shell: powershell
        run: |
          $dir = "dist/models/vosk_stt"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip"
          Invoke-WebRequest -Uri $url -OutFile "$dir/vosk-model-small-ru-0.22.zip"
          Expand-Archive -Path "$dir/vosk-model-small-ru-0.22.zip" -DestinationPath $dir -Force
          Remove-Item "$dir/vosk-model-small-ru-0.22.zip"

      - name: Download Vosk TTS model
        shell: powershell
        run: |
          $dir = "dist/models/vosk_tts"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://alphacephei.com/vosk/models/vosk-model-tts-ru-0.7-multi.zip"
          Invoke-WebRequest -Uri $url -OutFile "$dir/vosk-model-tts-ru-0.7-multi.zip"
          Expand-Archive -Path "$dir/vosk-model-tts-ru-0.7-multi.zip" -DestinationPath $dir -Force
          Remove-Item "$dir/vosk-model-tts-ru-0.7-multi.zip"

      - name: Build with PyInstaller
        shell: powershell
        run: |
          uv run pyinstaller --noconfirm --onedir `
            --name voice-assistant `
            --collect-data voice_assistant `
            --collect-all vosk `
            --collect-all vosk_tts `
            --collect-all openwakeword `
            --collect-all onnxruntime `
            --collect-all scipy `
            --collect-all sklearn `
            src/voice_assistant/__main__.py

      - name: Package release
        shell: powershell
        run: |
          Copy-Item .env.template dist/voice-assistant/.env
          Copy-Item README.md dist/voice-assistant/
          Copy-Item CHANGELOG.md dist/voice-assistant/
          Copy-Item scripts/install_autorun.bat dist/voice-assistant/
          Copy-Item scripts/remove_autorun.bat dist/voice-assistant/
          New-Item -ItemType Directory -Force -Path dist/voice-assistant/models | Out-Null
          Copy-Item -Recurse dist/models/vosk_stt dist/voice-assistant/models/
          Copy-Item -Recurse dist/models/vosk_tts dist/voice-assistant/models/
          Compress-Archive -Path dist/voice-assistant `
            -DestinationPath dist/voice-assistant.zip

      - name: Create Forgejo release
        shell: powershell
        run: python scripts/create_release.py
